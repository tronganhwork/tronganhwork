<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">La Trong Anh, Security Engineer</title>
  <desc id="d">Information Security, UIT VNU-HCM. Threat detection, log analysis, IDS/IPS, incident response.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .k { animation: appear 0.01s backwards; }
    .k1 { animation-delay: 0.5s; } .k2 { animation-delay: 0.62s; } .k3 { animation-delay: 0.74s; }
    .k4 { animation-delay: 0.86s; } .k5 { animation-delay: 0.98s; } .k6 { animation-delay: 1.1s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .sweep { transform-origin: 1010px 160px; animation: spin 6s linear infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
    .p2 { animation-delay: 0.8s; } .p3 { animation-delay: 1.6s; }
    @keyframes appear { from, to { fill-opacity: 0; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(3.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .k, .cursor, .sweep, .ping { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2f81f7" stroke-opacity="0.09"/>
    </pattern>
    <radialGradient id="glow" cx="1010" cy="160" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="1010" y1="160" x2="1130" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="0.6" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- terminal prompt -->
  <text x="70" y="82" class="mono" font-size="22">
    <tspan fill="#3fb950">tronganh@sec</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan class="k k1" fill="#e6edf3">w</tspan><tspan class="k k2" fill="#e6edf3">h</tspan><tspan class="k k3" fill="#e6edf3">o</tspan><tspan class="k k4" fill="#e6edf3">a</tspan><tspan class="k k5" fill="#e6edf3">m</tspan><tspan class="k k6" fill="#e6edf3">i</tspan><tspan class="cursor" fill="#58a6ff"> ▋</tspan>
  </text>

  <!-- name and role -->
  <text x="68" y="156" class="sans" font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="0.5">La Trong Anh</text>
  <text x="70" y="198" class="sans" font-size="24">
    <tspan fill="#58a6ff" font-weight="600">Security Engineer</tspan><tspan fill="#8b949e">  ·  Information Security @ UIT, VNU-HCM</tspan>
  </text>

  <!-- focus tags -->
  <g class="mono" font-size="15" text-anchor="middle" fill="#c9d1d9">
    <rect x="70" y="226" width="168" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="154" y="248">Threat Detection</text>
    <rect x="250" y="226" width="132" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="316" y="248">Log Analysis</text>
    <rect x="394" y="226" width="105" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="446.5" y="248">IDS / IPS</text>
    <rect x="511" y="226" width="177" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="599.5" y="248">Incident Response</text>
  </g>

  <!-- radar -->
  <g fill="none" stroke="#2f81f7" stroke-opacity="0.35">
    <circle cx="1010" cy="160" r="40"/>
    <circle cx="1010" cy="160" r="80"/>
    <circle cx="1010" cy="160" r="120"/>
    <path d="M890 160H1130M1010 40V280" stroke-dasharray="3 6"/>
  </g>
  <path class="sweep" d="M1010 160 L1130 160 A120 120 0 0 0 1102.0 82.9 Z" fill="url(#beam)"/>

  <!-- alerts on the radar -->
  <g class="mono" font-size="11">
    <circle cx="1062" cy="104" r="5" fill="#f85149"/>
    <circle class="ping" cx="1062" cy="104" r="5" fill="none" stroke="#f85149" stroke-width="2"/>
    <text x="1074" y="100" fill="#f85149">EVT 4625</text>

    <circle cx="952" cy="208" r="5" fill="#d29922"/>
    <circle class="ping p2" cx="952" cy="208" r="5" fill="none" stroke="#d29922" stroke-width="2"/>
    <text x="886" y="232" fill="#d29922">ET SCAN</text>

    <circle cx="1068" cy="226" r="5" fill="#3fb950"/>
    <circle class="ping p3" cx="1068" cy="226" r="5" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="1080" y="246" fill="#3fb950">CWE-78</text>
  </g>
  <text x="1056" y="28" class="mono" font-size="12" fill="#8b949e" text-anchor="end" letter-spacing="3">BLUE TEAM</text>

  <rect x="0" y="316" width="1200" height="4" fill="url(#rule)"/>
</svg>
